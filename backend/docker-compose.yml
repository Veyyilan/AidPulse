# Local MongoDB for AidPulse development.
#   docker compose up -d
#   MONGO_URI=mongodb://127.0.0.1:27017/aidpulse
services:
  mongo:
    image: mongo:7
    container_name: aidpulse-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
